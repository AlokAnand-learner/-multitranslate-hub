<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MultiTranslate Hub & Toolkit</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #151e32;
      --border: #24324f;
      --primary: #38bdf8;
      --accent: #818cf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #34d399;
      --danger: #f87171;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
    }
    /* Tabs Navigation */
    .nav-tabs {
      display: flex;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .tab-btn {
      flex: 1;
      padding: 14px 6px;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: rgba(56, 189, 248, 0.05);
    }
    /* Main Content */
    .container {
      padding: 14px;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }
    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      position: relative;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    select, input, textarea {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-size: 14px;
      outline: none;
    }
    select {
      cursor: pointer;
    }
    textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.5;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .icon-actions {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .icon-btn:hover, .icon-btn:active {
      color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
    }
    .icon-btn.recording {
      color: var(--danger);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }
    .swap-container {
      display: flex;
      justify-content: center;
      margin: -6px 0 10px 0;
    }
    .action-btn {
      background: var(--primary);
      color: #0b1120;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .action-btn:active {
      opacity: 0.85;
    }
    /* Floating AI Button */
    .ai-fab {
      position: fixed;
      right: 18px;
      bottom: 20px;
      width: 52px;
      height: 52px;
      border-radius: 26px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      color: #0b1120;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.4);
      cursor: pointer;
      z-index: 500;
    }
    /* AI Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(3px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-card {
      background: #151e32;
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.25s ease-out;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.5);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .issue-box {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.3);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .suggestion-box {
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .fix-btn {
      background: var(--success);
      color: #064e3b;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 6px;
      width: 100%;
    }
    /* Terminal Output */
    .terminal-out {
      background: #050811;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      min-height: 120px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #a5f3fc;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('tab-trans')">
      <span>文/A</span>
      <span>Translate</span>
    </button>
    <button class="tab-btn" onclick="switchTab('tab-homo')">
      <span>TT</span>
      <span>Homoglyphs</span>
    </button>
    <button class="tab-btn" onclick="switchTab('tab-code')">
      <span>&gt;_</span>
      <span>Compiler</span>
    </button>
  </nav>

  <div class="container">
    <!-- TAB 1: TRANSLATOR & GRAMMAR AUDIT -->
    <div id="tab-trans" class="tab-pane active">
      <div class="card">
        <div class="card-header">
          <select id="srcLang" onchange="resetRecLang()">
            <option value="auto">Auto-Detect</option>
            <option value="en" selected>English</option>
            <option value="hi">Hindi (हिंदी)</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ru">Russian</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
          </select>
        </div>
        <textarea id="srcText" placeholder="Enter text or speak..." oninput="updateWordCount()"></textarea>
        <div class="card-footer">
          <div class="icon-actions">
            <button class="icon-btn" id="micBtn" onclick="toggleSpeech()" title="Speech to text">🎤</button>
            <button class="icon-btn" onclick="speakText('srcText', 'srcLang')" title="Listen">🔊</button>
            <button class="icon-btn" onclick="clearInput()" title="Clear">🗑️</button>
          </div>
          <span id="charCount">0 characters | 0 words</span>
        </div>
      </div>

      <div class="swap-container">
        <button class="icon-btn" onclick="swapLanguages()" style="background:var(--card-bg); border:1px solid var(--border); padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600;">
          ⇅ Swap
        </button>
      </div>

      <div class="card">
        <div class="card-header">
          <select id="targetLang">
            <option value="hi" selected>Hindi (हिंदी)</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ru">Russian</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
          </select>
        </div>
        <textarea id="targetText" readonly placeholder="Authentic native translation appears here..."></textarea>
        <div class="card-footer">
          <div class="icon-actions">
            <button class="icon-btn" onclick="speakText('targetText', 'targetLang')" title="Listen output">🔊</button>
            <button class="icon-btn" onclick="copyResult()" title="Copy result">📋</button>
          </div>
          <button class="action-btn" style="width: auto; padding: 6px 14px; font-size: 12px;" onclick="executeTranslation()">Translate</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: HOMOGLYPHS & CIPHERS -->
    <div id="tab-homo" class="tab-pane">
      <div class="card">
        <h4 style="margin-bottom: 8px;">Unicode Homoglyphs & Ciphers</h4>
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Converts ASCII to lookalike characters or encodes cryptographic ciphers.</p>
        <textarea id="homoInput" placeholder="Enter text to mutate or cipher..."></textarea>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin: 10px 0;">
          <button class="action-btn" onclick="convertHomoglyphs()">Homoglyph (Cyrillic)</button>
          <button class="action-btn" onclick="runCipher('rot13')">ROT13 Cipher</button>
          <button class="action-btn" onclick="runCipher('base64')">Base64 Encode</button>
          <button class="action-btn" onclick="runCipher('binary')">Binary ASCII</button>
        </div>
        <textarea id="homoOutput" readonly placeholder="Output will appear here..."></textarea>
      </div>
    </div>

    <!-- TAB 3: SANDBOX CODE COMPILER -->
    <div id="tab-code" class="tab-pane">
      <div class="card">
        <h4 style="margin-bottom: 8px;">JavaScript Execution Sandbox</h4>
        <textarea id="codeEditor" rows="6" style="font-family:monospace; font-size:13px;">// Enter standard JavaScript:
const items = ["Earth", "Mars", "Jupiter"];
items.forEach(planet => console.log("Orbiting: " + planet));</textarea>
        <div style="margin-top: 10px;">
          <button class="action-btn" onclick="runCode()">Run Code 🚀</button>
        </div>
        <div class="terminal-out" id="termOutput">&gt; Console ready.</div>
      </div>
    </div>
  </div>

  <!-- FLOATING AI AUDIT BUTTON -->
  <button class="ai-fab" onclick="openAIAssistant()" title="Analyze Grammar & Edit">✦</button>

  <!-- AI MODAL SHEET -->
  <div class="modal-overlay" id="aiModal" onclick="closeAIAssistant(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3><span>✦</span> Grammar Audit & AI Assistant</h3>
        <button class="icon-btn" onclick="forceCloseModal()" style="font-size: 16px;">✕</button>
      </div>
      <div class="modal-body" id="aiModalBody">
        <p style="color:var(--text-muted); font-size:13px;">Analyzing input text...</p>
      </div>
    </div>
  </div>

  <script>
    /* TAB SWITCHER */
    function switchTab(tabId) {
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (tabId === 'tab-trans') document.querySelectorAll('.tab-btn')[0].classList.add('active');
      if (tabId === 'tab-homo') document.querySelectorAll('.tab-btn')[1].classList.add('active');
      if (tabId === 'tab-code') document.querySelectorAll('.tab-btn')[2].classList.add('active');
    }

    /* WORD COUNT & STATS */
    function updateWordCount() {
      const text = document.getElementById('srcText').value;
      const chars = text.length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('charCount').innerText = `${chars} characters | ${words} words`;
    }

    function clearInput() {
      document.getElementById('srcText').value = '';
      document.getElementById('targetText').value = '';
      updateWordCount();
    }

    function swapLanguages() {
      const s = document.getElementById('srcLang');
      const t = document.getElementById('targetLang');
      if (s.value === 'auto') s.value = 'en';
      const tempLang = s.value;
      s.value = t.value;
      t.value = tempLang;

      const srcText = document.getElementById('srcText');
      const targetText = document.getElementById('targetText');
      const tempVal = srcText.value;
      srcText.value = targetText.value;
      targetText.value = tempVal;
      updateWordCount();
    }

    /* TRANSLATION ENGINE (Authentic Multi-Language API) */
    async function executeTranslation() {
      const text = document.getElementById('srcText').value.trim();
      const target = document.getElementById('targetLang').value;
      let source = document.getElementById('srcLang').value;
      if (!text) return;

      document.getElementById('targetText').value = 'Translating...';

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${source}&tl=${target}&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        
        let translated = '';
        if (data && data[0]) {
          data[0].forEach(seg => {
            if (seg[0]) translated += seg[0];
          });
        }
        document.getElementById('targetText').value = translated || 'Translation completed with empty output.';
      } catch (err) {
        document.getElementById('targetText').value = 'Translation error: check your connection.';
      }
    }

    /* SPEECH RECOGNITION (MIC) */
    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('srcText').value = transcript;
        updateWordCount();
        executeTranslation();
      };
      recognition.onend = () => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      };
      recognition.onerror = () => {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      };
    }

    function toggleSpeech() {
      if (!recognition) {
        alert('Speech recognition is not supported on this browser.');
        return;
      }
      if (isRecording) {
        recognition.stop();
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      } else {
        const lang = document.getElementById('srcLang').value;
        recognition.lang = lang === 'auto' ? 'en-US' : (lang === 'hi' ? 'hi-IN' : lang);
        recognition.start();
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
      }
    }

    /* TEXT TO SPEECH (VOICE OUT) */
    function speakText(textareaId, langSelectId) {
      const text = document.getElementById(textareaId).value;
      if (!text || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const lang = document.getElementById(langSelectId).value;
      utterance.lang = lang === 'auto' ? 'en-US' : (lang === 'hi' ? 'hi-IN' : lang);
      window.speechSynthesis.speak(utterance);
    }

    function copyResult() {
      const text = document.getElementById('targetText').value;
      if (text) navigator.clipboard.writeText(text);
    }

    /* GRAMMAR AUDIT & AUTOMATED CORRECTION */
    async function openAIAssistant() {
      const text = document.getElementById('srcText').value.trim();
      const modal = document.getElementById('aiModal');
      const body = document.getElementById('aiModalBody');
      modal.classList.add('open');

      if (!text) {
        body.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">Please enter some text in the translator first.</p>';
        return;
      }

      body.innerHTML = '<p style="color:var(--primary); font-size:13px;">Running full linguistic and grammatical check...</p>';

      // Step 1: Client heuristic check (Handles standard subject-verb issues instantly)
      let detectedIssues = [];
      let autoCorrected = text;

      const grammarRules = [
        { regex: /\bYou is\b/gi, fix: 'You are', msg: '"You" takes the plural verb "are", not "is".' },
        { regex: /\bHe are\b/gi, fix: 'He is', msg: '"He" takes the singular verb "is".' },
        { regex: /\bShe are\b/gi, fix: 'She is', msg: '"She" takes the singular verb "is".' },
        { regex: /\bThey is\b/gi, fix: 'They are', msg: '"They" takes the plural verb "are".' },
        { regex: /\bI is\b/gi, fix: 'I am', msg: '"I" pairs with "am".' },
        { regex: /\bis go\b/gi, fix: 'are going', msg: 'Use continuous tense "are going" or base verb "go".' },
        { regex: /\bgo to home\b/gi, fix: 'go home', msg: 'In English, "home" functions adverbially without "to".' }
      ];

      grammarRules.forEach(rule => {
        if (rule.regex.test(autoCorrected)) {
          detectedIssues.push(rule.msg);
          autoCorrected = autoCorrected.replace(rule.regex, rule.fix);
        }
      });

      // Step 2: LanguageTool public grammar check API
      try {
        const response = await fetch('https://api.languagetool.org/v2/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ text: text, language: 'en-US' })
        });
        const data = await response.json();

        if (data.matches && data.matches.length > 0) {
          data.matches.forEach(m => {
            detectedIssues.push(m.message);
            if (m.replacements && m.replacements[0]) {
              const wrongWord = text.substring(m.offset, m.offset + m.length);
              autoCorrected = autoCorrected.replace(wrongWord, m.replacements[0].value);
            }
          });
        }
      } catch (e) {
        // Fallback uses heuristic check if API network request is blocked
      }

      // Step 3: Render suggestions & Auto-Edit button
      if (detectedIssues.length > 0) {
        body.innerHTML = `
          <div class="issue-box">
            <strong>⚠️ Grammatical Issues Found:</strong>
            <ul style="margin: 6px 0 0 16px; line-height: 1.5;">
              ${detectedIssues.map(msg => `<li>${msg}</li>`).join('')}
            </ul>
          </div>
          <div class="suggestion-box">
            <strong>💡 Suggested Correction:</strong>
            <p style="margin-top: 4px; font-weight: 600; color: #a7f3d0;">${autoCorrected}</p>
            <button class="fix-btn" onclick="applyCorrection('${autoCorrected.replace(/'/g, "\\'")}')">Apply Correction & Auto-Translate</button>
          </div>
        `;
      } else {
        body.innerHTML = `
          <div class="suggestion-box" style="border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.08);">
            <strong style="color:var(--primary);">✓ Structure Verified</strong>
            <p style="margin-top: 4px; font-size:13px; color:var(--text);">No grammatical or syntactic mistakes were detected in this sentence.</p>
          </div>
        `;
      }
    }

    function applyCorrection(fixedText) {
      document.getElementById('srcText').value = fixedText;
      updateWordCount();
      forceCloseModal();
      executeTranslation();
    }

    function closeAIAssistant(e) {
      if (e.target.id === 'aiModal') forceCloseModal();
    }

    function forceCloseModal() {
      document.getElementById('aiModal').classList.remove('open');
    }

    /* TAB 2: HOMOGLYPHS & CIPHERS */
    const homoglyphMap = {
      'a':'а','c':'с','e':'е','i':'і','j':'ј','o':'о','p':'р','s':'ѕ','x':'х','y':'у',
      'A':'А','B':'В','C':'С','E':'Е','H':'Н','I':'І','J':'Ј','K':'К','M':'М','O':'О','P':'Р','T':'Т','X':'Х','Y':'У'
    };

    function convertHomoglyphs() {
      const input = document.getElementById('homoInput').value;
      const res = input.split('').map(char => homoglyphMap[char] || char).join('');
      document.getElementById('homoOutput').value = res;
    }

    function runCipher(type) {
      const input = document.getElementById('homoInput').value;
      let out = '';
      if (type === 'rot13') {
        out = input.replace(/[a-zA-Z]/g, function(c){
          return String.fromCharCode((c <= 'Z' ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26);
        });
      } else if (type === 'base64') {
        try { out = btoa(unescape(encodeURIComponent(input))); } catch(e) { out = 'Encoding error'; }
      } else if (type === 'binary') {
        out = input.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join(' ');
      }
      document.getElementById('homoOutput').value = out;
    }

    /* TAB 3: RUNTIME JAVASCRIPT SANDBOX */
    function runCode() {
      const code = document.getElementById('codeEditor').value;
      const out = document.getElementById('termOutput');
      out.innerText = '';

      const logs = [];
      const originalLog = console.log;
      console.log = (...args) => {
        logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '));
      };

      try {
        const result = new Function(code)();
        if (result !== undefined) logs.push(`=> ${result}`);
        out.innerText = logs.length > 0 ? logs.join('\n') : '> Execution completed with no console output.';
      } catch (err) {
        out.innerText = `Error: ${err.message}`;
      } finally {
        console.log = originalLog;
      }
    }
  </script>
</body>
</html>
